[project]
name = "label-check"
version = "0.1.0"
description = "AI-powered TTB alcohol label verification (local-first, deterministic compliance)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Lightweight, offline-capable core readers (the bench runs with just these).
readers = [
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "rapidocr-onnxruntime>=1.3",
]
# Heavier engines — optional bake-off entrants, enabled only if installed.
easyocr = ["easyocr>=1.7"]
paddle = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
# Local vision-language fallback (Florence-2). transformers is PINNED: Florence-2's
# trust_remote_code modeling/config predates transformers 5.x and breaks on it
# (missing `forced_bos_token_id` / `_supports_sdpa`); 4.49 is the last known-good line.
vlm = ["torch>=2.2", "transformers>=4.49,<5", "timm>=1.0", "einops>=0.8"]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
